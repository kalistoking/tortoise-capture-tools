[build-system]
requires = ["setuptools>=77"]   # PEP 639 SPDX license expression support
build-backend = "setuptools.build_meta"

[project]
name = "tortoise-capture-tools"
version = "0.1.0"
description = "Decrypt and decode WoW 1.12.1 world-session captures into authorable tortoise-wow content"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["scapy>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tct = "tortoise_capture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
